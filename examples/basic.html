<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Snippet — Basic Example</title>
    <!-- Single script tag — that's all you need -->
    <script src="../dist/circuit-snippet.js"></script>
</head>
<body>
    <h1>RC Low-Pass Filter</h1>
    <p>Drag the sliders to change resistance and frequency.</p>

    <circuit-snippet width="700" height="450" display-time="0.022">
        <script type="text/xml">
            <cir f="1" ts="0.000005" ic="10.20027730826997" cb="50" pb="50" vr="5" mts="5e-11">
              <v x="96 176 96 272" f="0" wf="2" fr="100" maxv="2"/>
              <g x="96 272 96 288" f="0"/>
              <w x="96 176 192 176" f="0"/>
              <w x="320 176 416 176" f="0"/>
              <c x="320 176 320 272" f="0" c="0.00001" iv="0.001" sr="0" vd="0"/>
              <g x="320 272 320 288" f="0"/>
              <O x="416 176 480 176" f="0" sc="0"/>
              <r x="192 176 320 176" f="0" r="100"/>
              <o en="2" sp="16" f="x3" p="0">
                <p v="0" sc="5"/>
                <p e="6" v="0" sc="5"/>
              </o>
            </cir>
        </script>
        <script type="application/json">
            {
                "controls": [
                    { "component": "r:0", "param": "resistance", "label": "Resistance", "min": 10, "max": 10000, "scale": "log", "unit": "Ω" },
                    { "component": "v:0", "param": "frequency", "label": "Frequency", "min": 20, "max": 2000, "scale": "log", "unit": "Hz" }
                ]
            }
        </script>
    </circuit-snippet>
</body>
</html>
